name: WOODY website tests

on:
  push:
    branches:
      - main
      - fix/forest-persistent-scores-stats-20261117
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
